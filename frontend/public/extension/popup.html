<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ClipInsight AI</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #070810;
      color: #F8FAFC;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      font-weight: 800;
      font-size: 16px;
      background: linear-gradient(135deg, #7C5CFC, #3DD9FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .desc {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      line-height: 1.4;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #7C5CFC, #3DD9FF);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(124,92,252,0.3);
    }
    button:hover {
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="color:#7C5CFC;">✦</span>
    <span class="logo">ClipInsight AI</span>
  </div>
  <div class="desc">
    Instant Multimodal AI video analysis for Instagram Reels, TikToks, and YouTube Shorts.
  </div>
  <button id="openApp">Open ClipInsight Web Portal</button>
  <script>
    document.getElementById('openApp').addEventListener('click', () => {
      chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
        const url = tabs[0]?.url || '';
        window.open(`http://localhost:3000?url=${encodeURIComponent(url)}`, '_blank');
      });
    });
  </script>
</body>
</html>
